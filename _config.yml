# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Eneji Ohieku's Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: Ohieku Eneji Peacemaker
headline: Roboticist • Embedded Systems Engineer • ROS Control Member • Competitive Programmer
description: >- # dont remove this line. this will ignore all new lines until the next section
  Roboticist and embedded systems engineer building autonomous machines from bare-metal silicon to intelligent control.
  Self-taught since junior school with Python game development, later mastering modern C++ through textbooks and deep curiosity.
  Member and contributor to the official ROS Control (ros-controls) organization, lead architect of Zenbedded (bridging Zephyr RTOS with ros2_control via Zenoh), and 1st-place hackathon champion (Cavista Hackathon 2025 & Codefest 2025 NIGHACK).
  Pursuing B.Eng. in Mechatronics Engineering at LASUSTECH while competing in algorithmic problem solving (Kattis) with deep foundations in Data Structures & Algorithms (DSA).



