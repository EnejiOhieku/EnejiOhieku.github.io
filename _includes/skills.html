<!-- _includes/skills.html -->
<section id="skills" class="skills-section">
    <div class="section-header">
        <span class="section-tag">Technical Competencies</span>
        <h2 class="section-title">Skills & Tooling</h2>
        <p class="section-subtitle">A comprehensive breakdown of tools, frameworks, and engineering disciplines across the stack.</p>
    </div>
        
    <div class="skills-grid">
        {% for category in site.skills %}
            <div class="skills-category-card">
                <div class="category-header">
                    <span class="category-indicator"></span>
                    <h3 class="category-title">{{ category.category }}</h3>
                </div>
            
                <div class="tools-chip-list">
                    {% for tool in category.tools %}
                        <span class="tool-chip">{{ tool }}</span>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
</section>
